# Botslab C213 (T23N). GPIO number = bank*32 + pin (PA=0, PB=32).
# Source: stock firmware C213C_v1.0.4.5649 (kernel board data, gpio.config,
# init scripts, audio/sensor module defaults, the stock camera app).
alarm_in=-1
alarm_out=-1
# Reset button PA18, active low (stock gpio-keys KEY_F14)
button=18
# Touch "call" button PB26, active low (stock gpio-keys KEY_F15, wakeup)
button_call=58
# IR-cut filter is on TMI8152 channel 5 (SPI), not on GPIO
ircut1=-1
ircut2=-1
# Status LEDs, active low: PB18 green, PB25 blue
led1=57
led2=50
# IR illuminator PB17 (stock gpio.config "ircut_led")
light_ir=49
light_wl=-1
light_sensor=-1
# SD card detect PB19, active low (stock msc0 platform data)
mmc_cd=51
mmc_pwr=-1
# Speaker amplifier enable PB21, active high (stock app qhHALAOSetPAOnOrOff)
speaker=53
# Ethernet PHY reset PB20, active low (stock U-Boot "ethphy reset"); pulsed by muxes.sh
eth_phy_reset=52
# TMI8152 power stage enable PB31, must stay high (stock audio.ko default spk_gpio)
tmi_en=63
# PA8: stock qihoo_init.sh sets it, but the pad does not respond on T23N
aux_en=-1
usb=-1
