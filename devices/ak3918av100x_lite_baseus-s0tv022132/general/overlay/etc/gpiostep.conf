# Baseus P1 Pro pan/tilt head, read by majestic-af's gpiostep actuator. The
# coils are on GPIO (gpiostep pan_gpios=65,66,58,67 tilt_gpios=68,69,2,56,
# see /etc/modules), in the order of the stock giec_motor_drv.ko's half-step
# table (0x08 0x0c 0x04 0x06 0x02 0x03 0x01 0x09, bit 3 to bit 0), which is
# gpiostep's sequence.
# Travel from one stop to the other: the stock driver's limits, 3822 and 854
# half-steps, in gpiostep steps of 8.
pan_travel=477
tilt_travel=106
# Directions checked on the camera with the WebUI's arrows.
pan_left=1
tilt_up=-1
pan_delay_us=1000
tilt_delay_us=2000
# Find both stops once per boot, then centre the head.
home=1
